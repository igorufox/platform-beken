name: Release

# A push to main releases the version of platform.json (tag 1.0.0) when that release does not exist yet - a new release
# is a version bump of platform.json. No build here: ESPurna builds with this platform.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Release
        run: |
          TAG=$(python3 -c "import json; print(json.load(open('platform.json'))['version'].replace('+', '-'))")
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is released already"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file RELEASE.md
          fi
